name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach files to a GitHub release on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build, self-test and package
        shell: pwsh
        run: ./build_windows.ps1

      # Setup's stop script must leave nothing running from the install folder (a locked
      # vcruntime140.dll blocked an upgrade): try it on a stand-in folder with a program running.
      - name: Test Setup's stop script
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Fake Airlog"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "$env:SystemRoot\System32\PING.EXE" "$dir\Airlog.exe"
          $p = Start-Process "$dir\Airlog.exe" -ArgumentList "-n 120 127.0.0.1" -PassThru -WindowStyle Hidden
          Start-Sleep 1
          if ($p.HasExited) { throw "the stand-in didn't start" }
          $t = Measure-Command { & powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging\stop_airlog.ps1 -Dir $dir | Write-Host }
          Start-Sleep 1
          $left = Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith("$dir\", [StringComparison]::OrdinalIgnoreCase) }
          if ($left) { throw "still running from the folder: $($left.Path)" }
          Write-Host ("OK: closed after {0:N0} s; the folder's files are free" -f $t.TotalSeconds)
          Remove-Item "$dir\Airlog.exe"   # fails if anything still had it locked

      - uses: actions/upload-artifact@v7
        with:
          name: Airlog-windows-x64
          path: |
            dist/Airlog-*.zip
            dist/Airlog-Setup-*.exe
            dist/Airlog-Viewer-Setup-*.exe
            dist/selftest*.txt
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    # Built on Debian 12 (glibc 2.36) so the binaries run on Debian 12+, Raspberry Pi OS 12+,
    # Ubuntu 23.04+ and other distros of that age or newer.
    container: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v7

      - name: Build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb xauth binutils dpkg-dev curl xz-utils unzip libportaudio2

      - name: Build, self-test and package
        run: ./build_unix.sh

      - name: Unit tests
        run: |
          # A real Icecast server for tests/test_icecast.py (the other streaming tests use fakes)
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends icecast2
          export PATH="$(ls -d "$PWD"/.build/ffmpeg-linux-*):$PATH"
          for t in tests/test_*.py; do .build/venv-linux-*/bin/python "$t"; done

      - uses: actions/upload-artifact@v7
        with:
          name: Airlog-linux-${{ matrix.arch }}
          path: |
            dist/Airlog-*.tar.gz
            dist/airlog_*.deb
            dist/airlog-viewer_*.deb
            dist/selftest-*.txt
          if-no-files-found: error

  macos:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The LGPL FFmpeg is built from source on macOS (prebuilt ones are GPL): reuse it until the script changes.
      - uses: actions/cache@v4
        with:
          path: .build/ffmpeg-macos-arm64
          key: ffmpeg-lgpl-macos-arm64-${{ hashFiles('packaging/build_ffmpeg_macos.sh') }}

      - name: Build, self-test and package
        run: ./build_unix.sh
        env:
          PYTHON: python

      - uses: actions/upload-artifact@v7
        with:
          name: Airlog-macos-arm64
          path: |
            dist/Airlog-*.dmg
            dist/selftest-*.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # Creates the release (with generated notes) only now, with every package attached at once.
      - uses: softprops/action-gh-release@v3
        with:
          name: Airlog ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/Airlog-*.zip
            artifacts/Airlog-Setup-*.exe
            artifacts/Airlog-Viewer-Setup-*.exe
            artifacts/Airlog-*.tar.gz
            artifacts/airlog_*.deb
            artifacts/airlog-viewer_*.deb
            artifacts/Airlog-*.dmg
